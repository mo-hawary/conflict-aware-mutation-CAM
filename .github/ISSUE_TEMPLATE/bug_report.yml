name: Bug report
description: Report incorrect CAM behavior
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a CAM bug. Please reduce it to the smallest three-state example you can.
  - type: input
    id: version
    attributes:
      label: CAM version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: originalState
      render: json
    validations:
      required: true
  - type: textarea
    id: submitted
    attributes:
      label: submittedState
      render: json
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: currentServerState
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
